name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify versions match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          fail=0

          # package.json is checked against the FULL tag, pre-release suffix
          # included, because it is what decides where the binary is fetched
          # from. `scripts/install.js` reads its version and builds
          # `<source>/v<version>/vibeknow-cli-<version>-<os>-<arch>`, while
          # build.sh names the release assets from the tag. Let those two drift
          # and every source 404s: npm installs fine, postinstall cannot find a
          # binary, and the connector fails to install for everyone. Nothing
          # else catches it — `npm publish` only rejects the exact-duplicate
          # case, so 0.7.1 against a v0.9.0 tag would ship a broken package.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=package.json::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION); install.js builds the binary URL from this field, so a mismatch 404s every download source"
            fail=1
          fi

          # The optional platform packages are pinned exactly, and they are
          # built from the tag. A pin left on the previous version resolves to
          # a package that exists — the last release's — so npm installs an
          # older binary beside a newer wrapper and reports success. Nothing
          # downstream notices: `vibeknow version` prints whatever that binary
          # says, and the connector's versionCheck then fails against a
          # correctly-published release.
          while IFS=$'\t' read -r dep pin; do
            if [ "$pin" != "$TAG_VERSION" ]; then
              echo "::error file=package.json::optionalDependencies.$dep is pinned to $pin, but this release is $TAG_VERSION"
              fail=1
            fi
          done < <(node -e "
            const d = require('./package.json').optionalDependencies || {};
            for (const [k, v] of Object.entries(d)) console.log(k + '\t' + v);
          ")

          # A pre-release tag carries the release it rehearses, so skills are
          # checked against that: v0.8.0-rc.1 expects skills at 0.8.0. Asking
          # an rc to restamp every SKILL.md would leave those files reading
          # 0.8.0-rc.1 at the moment the real release is cut, which is the
          # version skew this gate exists to catch. package.json above cannot
          # be relaxed the same way — it names a file that has to exist.
          SKILL_TAG_VERSION="${TAG_VERSION%%-*}"
          for f in skills/*/SKILL.md; do
            SKILL_VERSION="$(awk '/^version:/ {gsub(/[" ]/, "", $2); print $2; exit}' "$f")"
            if [ "$SKILL_VERSION" != "$SKILL_TAG_VERSION" ]; then
              echo "::error file=$f::SKILL.md version ($SKILL_VERSION) does not match release tag ($SKILL_TAG_VERSION)"
              fail=1
            fi
          done

          [ "$fail" = "0" ] || exit 1
          echo "package.json matches $TAG_VERSION; all skill versions match $SKILL_TAG_VERSION"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip

      # The staged platform packages travel separately: the release job wants
      # only the archives, and publish-npm wants only these.
      - name: Upload npm platform packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-platform-packages
          path: dist/npm/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag is marked as one so it never becomes the
          # "latest release" GitHub serves — install.js builds its download
          # URL from an exact version, but anything reading /releases/latest
          # would otherwise be handed a rehearsal build.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz dist/*.zip

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    # id-token: write is what OIDC trusted publishing signs with. Without it
    # `npm publish` falls back to looking for NODE_AUTH_TOKEN, which this job
    # no longer sets — so a missing permission here fails loudly rather than
    # silently reverting to a token that isn't there.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >=11.5.1 and Node >=22.14.0 — newer than
      # this job previously required, since it never had to mint OIDC tokens
      # before. actions/setup-node still sets the registry, which npm needs to
      # know where to publish even when it isn't authenticating with a token
      # against it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - name: Download npm platform packages
        uses: actions/download-artifact@v4
        with:
          name: npm-platform-packages
          path: dist/npm

      # The platform packages go first, and the order is load-bearing.
      # `vibeknow-cli` pins them exactly in optionalDependencies; publish it
      # while they are still missing and every install in that window resolves
      # nothing, silently — optional dependencies that 404 are skipped, not
      # failed — leaving those users on the download fallback the whole
      # arrangement exists to avoid.
      #
      # Each is published on the same dist-tag as the main package, so an rc
      # rehearsal pulls rc binaries rather than `latest` ones.
      #
      # This step never carried NODE_AUTH_TOKEN even before the OIDC move —
      # every run through v0.9.1 published unauthenticated and got the same
      # 404 npm returns to any anonymous PUT, on every package regardless of
      # scope or token settings. It only ever appeared to pass because these
      # packages had already been published by hand moments earlier: the
      # fallback below does an unauthenticated `npm view`, which succeeds for
      # any public package whether or not this job can publish, and printed
      # "already published" over a `npm publish` that had in fact just failed.
      # Trusted publishing removes the class of bug, not just this instance —
      # there is no per-step token to forget.
      - name: Publish platform packages
        run: |
          npm_tag="latest"
          case "$GITHUB_REF_NAME" in *-*) npm_tag="rc" ;; esac
          for dir in dist/npm/*/; do
            name="$(node -p "require('./$dir/package.json').name")"
            echo "publishing $name to dist-tag: $npm_tag"
            # Republishing an identical version is an error, not a no-op, so a
            # re-run after a partial failure has to tolerate the ones that
            # already landed.
            npm publish "$dir" --access public --tag "$npm_tag" || {
              published="$(npm view "$name@${GITHUB_REF_NAME#v}" version 2>/dev/null || true)"
              if [ -n "$published" ]; then
                echo "$name@${GITHUB_REF_NAME#v} is already published; continuing"
              else
                echo "::error::failed to publish $name and it is not on the registry"
                exit 1
              fi
            }
          done

      # npm puts every publish on the `latest` dist-tag unless told otherwise,
      # pre-releases included. Without this branch, tagging v0.8.0-rc.1 to
      # rehearse the install path would hand that build to every existing user
      # and to WorkBuddy's `npm install -g vibeknow-cli` — the opposite of a
      # rehearsal. `--tag rc` keeps it reachable as vibeknow-cli@rc only.
      - name: Publish vibeknow-cli
        run: |
          npm_tag="latest"
          case "$GITHUB_REF_NAME" in *-*) npm_tag="rc" ;; esac
          echo "publishing to dist-tag: $npm_tag"
          npm publish --access public --tag "$npm_tag"

      # Not migrated to trusted publishing: this package is a standing
      # `dependencies: { "vibeknow-cli": "*" }` redirect that rarely changes
      # and has never needed the platform packages' auth to work (it predates
      # today's token churn entirely, same as vibeknow-cli always did). The
      # `|| true` is for the ordinary case of nothing new to publish, not for
      # swallowing an auth failure.
      - name: Publish vibeknow (redirect package)
        working-directory: npm/vibeknow
        run: npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
